# LeRobot ACT reason/deploy policy configuration.
# Used by run_record.py and DAgger rollout when policy.type == "act".
# Keep model-architecture fields aligned with the training checkpoint.

# -------------------------
# Runtime / framework
# -------------------------
n_obs_steps: 1

device: cuda
use_amp: false

# pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/dagger_rounds/task3_step1/8mL_empty_left_v05/round_001/train/checkpoints/last/pretrained_model"
# pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1/8mL_empty_left\
#                   /act_20260509_E125_SW_V01/checkpoints/last/pretrained_model"
pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1\
                  /2mL_empty_right/act_20260521_E249_V01/checkpoints/014000/pretrained_model"

# -------------------------
# Action chunking / inference
# -------------------------
chunk_size: 20
n_action_steps: 1
temporal_ensemble_coeff: 0.05

# -------------------------
# Normalization
# -------------------------
normalization_mapping:
  VISUAL: MEAN_STD
  STATE: MEAN_STD
  ACTION: MEAN_STD

# -------------------------
# Vision encoder
# -------------------------
vision_backbone: resnet18
pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
replace_final_stride_with_dilation: false

# -------------------------
# Transformer
# -------------------------
pre_norm: false
dim_model: 512
n_heads: 8
dim_feedforward: 3200
feedforward_activation: relu
n_encoder_layers: 4
n_decoder_layers: 1

# -------------------------
# VAE latent action modeling
# -------------------------
latent_dim: 32

# -------------------------
# Optional fields normally omitted for reason/deploy
# -------------------------
# input_features / output_features:
#   Omit to infer policy features from the dataset metadata.
# Hub upload metadata is not used by run_record.py:
#   push_to_hub, repo_id, private, tags, license.
# Training-only ACT fields:
#   use_vae, n_vae_encoder_layers, kl_weight, dropout,
#   optimizer_lr, optimizer_weight_decay, optimizer_lr_backbone.
