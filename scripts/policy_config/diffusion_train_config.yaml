# -------------------------
# Runtime / framework
# -------------------------
n_obs_steps: 2

device: cuda

push_to_hub: false

# -------------------------
# Horizon / action sequence
# -------------------------
horizon: 16
n_action_steps: 4
# DiffusionConfig default: horizon - n_action_steps - n_obs_steps + 1.
drop_n_last_frames: 7

# -------------------------
# Normalization
# -------------------------
normalization_mapping:
  VISUAL: MEAN_STD
  STATE: MIN_MAX
  ACTION: MIN_MAX

# -------------------------
# Vision encoder
# -------------------------
vision_backbone: resnet18
crop_shape: [160, 160]
crop_is_random: true
pretrained_backbone_weights: null
use_group_norm: true
spatial_softmax_num_keypoints: 32
use_separate_rgb_encoder_per_camera: false

# -------------------------
# Diffusion U-Net
# -------------------------
down_dims: [512, 1024, 2048]
kernel_size: 5
n_groups: 8
diffusion_step_embed_dim: 128
use_film_scale_modulation: true

# -------------------------
# Noise scheduler
# -------------------------
noise_scheduler_type: DDPM
num_train_timesteps: 100
beta_schedule: squaredcos_cap_v2
beta_start: 0.0001
beta_end: 0.02
prediction_type: epsilon

# -------------------------
# Loss computation
# -------------------------
do_mask_loss_for_padding: false

# -------------------------
# Optimizer / training preset
# -------------------------
optimizer_lr: 0.0001
optimizer_betas: [0.95, 0.999]
optimizer_eps: 0.00000001
optimizer_weight_decay: 0.000001
scheduler_name: cosine
scheduler_warmup_steps: 500

# -------------------------
# Optional fields normally omitted for training
# -------------------------
# input_features / output_features:
#   Omit to infer policy features from the dataset metadata.
# use_amp:
#   Not consumed by the custom run_train.py path; mixed precision is owned by Accelerator.
# Fine-tune / resume from an existing pretrained model:
#   pretrained_path: /path/to/checkpoints/.../pretrained_model
# Hub upload metadata, only needed when push_to_hub: true:
#   repo_id, private, tags, license.
# Inference-only diffusion fields:
#   num_inference_steps, clip_sample, clip_sample_range.
