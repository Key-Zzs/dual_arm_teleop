# LeRobot Diffusion Policy configuration.
# Used by run_record.py and run_train.py when policy.type is one of:
# diffusion, dp, diffusion_policy.
# Defaults are aligned with src/lerobot/policies/diffusion/configuration_diffusion.py.
#
# Notes:
# - Model-architecture fields must match the checkpoint used for inference.
# - input_features/output_features are usually inferred from the dataset metadata
#   and should stay empty unless you intentionally want to override them.
# - This project defaults to local training, so push_to_hub is disabled here.
#   Set push_to_hub: true together with repo_id when you want Hub upload.

# -------------------------
# Runtime / framework
# -------------------------
n_obs_steps: 2

input_features: {}
output_features: {}

device: cuda
use_amp: false

push_to_hub: false
repo_id: shenzhaolong/act_policy
private: null
tags: null
license: null
pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1/2mL_empty_right/dp_20260520_E249_V01/checkpoints/021000/pretrained_model"

# -------------------------
# Horizon / action sequence
# -------------------------
horizon: 16
n_action_steps: 4

# DiffusionConfig default: horizon - n_action_steps - n_obs_steps + 1.
drop_n_last_frames: 7

# -------------------------
# Normalization
# -------------------------
normalization_mapping:
  VISUAL: MEAN_STD
  STATE: MIN_MAX
  ACTION: MIN_MAX

# -------------------------
# Vision encoder
# -------------------------
vision_backbone: resnet18
crop_shape: [84, 84]
crop_is_random: true
pretrained_backbone_weights: null
use_group_norm: true
spatial_softmax_num_keypoints: 32
use_separate_rgb_encoder_per_camera: false

# -------------------------
# Diffusion U-Net
# -------------------------
down_dims: [512, 1024, 2048]
kernel_size: 5
n_groups: 8
diffusion_step_embed_dim: 128
use_film_scale_modulation: true

# -------------------------
# Noise scheduler / denoising
# -------------------------
noise_scheduler_type: DDPM
num_train_timesteps: 100
beta_schedule: squaredcos_cap_v2
beta_start: 0.0001
beta_end: 0.02
prediction_type: epsilon
clip_sample: true
clip_sample_range: 1.0

# null means use the same value as num_train_timesteps at inference time.
num_inference_steps: null

# -------------------------
# Loss computation
# -------------------------
do_mask_loss_for_padding: false

# -------------------------
# Optimizer / training preset
# -------------------------
optimizer_lr: 0.0001
optimizer_betas: [0.95, 0.999]
optimizer_eps: 0.00000001
optimizer_weight_decay: 0.000001
scheduler_name: cosine
scheduler_warmup_steps: 500
