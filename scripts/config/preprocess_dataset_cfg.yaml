preprocess_dataset:
  source:
    repo_id: "nero_task3_step1_random/2mL_empty_right"
    root: "/home/deepcybo/.cache/huggingface/lerobot/nero_task3_step1_random/2mL_empty_right_merged_E125"
    episodes: null        # null means all episodes, or set e.g. [0, 1, 2]
    max_episodes: null    # optional quick-test limit
    video_backend: "torchcodec" # torchcodec | pyav | video_reader

  output:
    repo_id: "nero_task3_step1_random/2mL_empty_right"
    root: "/home/deepcybo/.cache/huggingface/lerobot/nero_task3_step1_random/2mL_empty_right_merged_E125_cleaned"
    overwrite: false
    image_writer_threads: 4
    batch_encoding_size: 1
    video_backend: "torchcodec"
    # Keep output videos small. This avoids repeatedly stream-copy concatenating many AV1 episode clips
    # into one long mp4, which can create rare packets that fail random-access decoding during training.
    video_files_size_in_mb: 1

  dry_run: false

  quality:
    min_output_frames: 1
    drop_short_episodes: false

  verification:
    enabled: true
    video_backend: "torchcodec"
    full_scan: true
    sample_count: 512
    max_failures: 20
    fail_on_error: true

  # 1) Compress long no-motion spans instead of deleting every zero-action frame.
  static_trim:
    enabled: true
    min_static_frames: 30
    keep_start_frames: 5
    keep_end_frames: 5
    translation_norm_threshold: 0.001
    rotation_norm_threshold: 0.005

  # 2) Smooth noisy Cartesian command labels before writing the new dataset.
  action_smoothing:
    enabled: false
    method: "median"      # one of: median, ema, median_ema
    median_window: 3      # odd number recommended
    ema_alpha: 0.35       # used by ema / median_ema
    smooth_cartesian: true
    smooth_gripper: false
    max_translation_delta: 0.06
    max_rotation_delta: 0.08

  # 3) Always preserve context around gripper open/close events.
  gripper_events:
    enabled: true
    change_threshold: 0.5
    keep_radius_frames: 15
