train:
  training:
    device: cuda # cuda / cpu / auto; priority is higher than policy.device
    gpu:
      enabled: true
      visible_devices: "0" # same effect as CUDA_VISIBLE_DEVICES; empty string keeps the current environment
      max_num_gpus: 1 # when multiple GPUs are visible, keep the first N
      memory_fraction: 0.70 # PyTorch per-process CUDA memory cap; null means no cap
      allow_tf32: true
      cudnn_benchmark: false
      empty_cache_on_start: true
      log_gpu_info: true
      fail_if_cuda_unavailable: false

  dataset:
    repo_id: "nero_task3_step1_random/dual_empty"
    # Local dataset directory. It should point to the dataset repo root.
    # root: "/home/deepcybo/.cache/huggingface/lerobot/franka_dual_arm/left_right_pick_merged_E150"
    root: "/home/deepcybo/.cache/huggingface/lerobot/nero_task3_step1_random/dual_empty_merged_E200_hybrid_cleaned"
    video_backend: "torchcodec" # torchcodec | pyav | video_reader
    # Corrupt video packets found by full dataset decode scan; the training sampler skips these dataset indices.
    # skip_indices: [10076, 16318, 16319, 19159, 19182, 19183]

  env:

  policy:
    # Supported: act | diffusion | dp | diffusion_policy.
    # 推荐保持为普通 ACT；轮次式 DAgger 会由 run_dagger_rounds.py 在内存中注入训练参数。
    type: "act"
    config_path: scripts/config/policy_config/act_train_config.yaml
    # For diffusion:
    # type: "diffusion"
    # config_path: scripts/config/policy_config/diffusion_train_config.yaml

    # Policy hyperparameters have been moved to scripts/config/policy_config/*_train_config.yaml.

  output_dir: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1_random/dual_empty/act_20260603_E200"
  job_name: "act_dual_empty_20260603_E200"

  resume: false
  seed: 1000
  # Number of workers for the dataloader.
  num_workers: 4
  batch_size: 32
  keyframe_sampler:
    # Optional action-window keyframe oversampling. Disabled by default; does not change loss weighting.
    enabled: false
    annotation_weight_column: "annotation.keyframe_weight"
    annotation_event_column: "annotation.gripper_event"
    positive_if_weight_gt: 1.0
    positive_event_ids: [2, 5] # closing/opening
    include_pre_post_events: true
    positive_sample_weight: 3.0
    normal_sample_weight: 1.0
    max_sample_weight: 4.0
    require_annotation: false
    seed: 0
    log_sampler_stats: true
  debug_metrics:
    enabled: true
    write_annotation_summary_json: true
    write_sampler_summary_json: true
    write_batch_metrics_preview: false
    max_preview_batches: 5
    plot_annotation_distribution: false
  steps: 80_000
  eval_freq: 2_000
  log_freq: 500 # Nero historical value
  save_checkpoint: true
  # Checkpoint is saved every `save_freq` training iterations and after the last training step.
  save_freq: 20_000
  use_policy_training_preset: true

  eval:
    n_episodes: 10
    batch_size: 8

  wandb:
    enable: true
    # project: "lerobot_franka"
    project: "lerobot_nero"
    # entity: "your-wandb-username"
    # notes: "training notes"
    # run_id: "custom-run-id"
    mode: "online" # Allowed values: online, offline, disabled. Defaults to online.
